version: "1.0"
tables:
  pbcseq:
    file_path: "pbcseq.csv"
    patient_id: "id"
    timestamp: "visit_date"
    timestamp_format: "%Y-%m-%d"
    attributes:
      - "day"
      - "futime"
      - "status"
      - "trt"
      - "age"
      - "sex"
      - "ascites"
      - "hepato"
      - "spiders"
      - "edema"
      - "bili"
      - "chol"
      - "albumin"
      - "alk_phos"
      - "ast"
      - "platelet"
      - "protime"
      - "stage"
